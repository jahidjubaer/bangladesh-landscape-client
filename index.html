<!doctype html>
<html lang="bn" data-theme="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0d7a68" />
    <meta
      name="description"
      content="বাংলাদেশ ল্যান্ডস্কেপ — জেলাভিত্তিক ভ্রমণ গাইড, ট্যুর প্ল্যান ও লোকাল গাইড। এক জায়গায় আপনার সব ভ্রমণ সমাধান।"
    />
    <!-- Static share defaults: non-JS scrapers (Facebook, WhatsApp) read these -->
    <meta property="og:site_name" content="বাংলাদেশ ল্যান্ডস্কেপ" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="বাংলাদেশ ল্যান্ডস্কেপ — জেলাভিত্তিক ভ্রমণ গাইড" />
    <meta
      property="og:description"
      content="৬৪ জেলার দর্শনীয় স্থান, AI ট্যুর প্ল্যান, ভেরিফাইড লোকাল গাইড, হাউসবোট ও হোটেল — হাওর থেকে পাহাড়, সব এক জায়গায়।"
    />
    <!-- Scrapers need an absolute image URL — update the domain at deploy time (matches robots.txt) -->
    <meta property="og:image" content="https://bangladeshlandscape.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="bn_BD" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bangladeshlandscape.com/og-cover.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before first paint to avoid flash
      try {
        var t = localStorage.getItem('bl-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', 'landscape-dark');
      } catch (e) {}
    </script>
    <title>বাংলাদেশ ল্যান্ডস্কেপ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
